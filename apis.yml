apis:
- name: JAGGAER Advanced Sourcing Optimizer (ASO) API
  description: >-
    REST/JSON API surface for the JAGGAER (formerly SciQuest) Advanced Sourcing
    Optimizer, secured with OAuth 2.0 client-credentials. Grouped into the Customer
    Host Entity Service (query ASO events for a customer), the Event Entity Service
    (interact with events, load suppliers, retrieve optimization results) and the
    Quay API (submit, manage and track optimization jobs), plus asynchronous
    download and entity import/upload patterns.
