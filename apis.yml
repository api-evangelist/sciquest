aid: sciquest
name: SciQuest
description: >-
  SciQuest was a spend-management and e-procurement software company founded in
  1995 that grew into a source-to-settle suite spanning e-procurement, sourcing,
  contract lifecycle management, spend analytics, accounts payable and supplier
  management. In 2017 SciQuest rebranded as JAGGAER and consolidated its products
  into the JAGGAER One source-to-pay platform. JAGGAER exposes REST/JSON public
  APIs (request/response and event-driven push), cXML transactional messaging, an
  OAuth 2.0-secured Advanced Sourcing Optimizer (ASO) API, and 40+ prebuilt ERP
  connectors (SAP, Oracle, Workday, Microsoft Dynamics, NetSuite, Ellucian). This
  profile enriches the SciQuest lead against its live successor developer surface.
